[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fgm"
version = "0.1.0"
description = "Frequency-Corrected Geometric Matching for Test-Time Adaptation of Vision-Language Models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["fgm*", "third_party*"]

[tool.setuptools.package-data]
third_party = ["licenses/*"]
